# /etc/sysctl.d/90-velocita-panic.conf: a kernel panic or CPU soft lockup reboots
# the host after 10 s instead of leaving it frozen (proven on nuc2 2026-09-28:
# sysrq crash -> back unattended). Hard freezes are the watchdog's job.
kernel.panic = 10
kernel.softlockup_panic = 1
# An oops leaves the kernel in an unknown state; on an unattended voter a reboot is safer.
kernel.panic_on_oops = 1
# (The Pi 5 kernel has no soft-lockup detector, so softlockup_panic is absent there and
# `sysctl --system` reports it; harmless: the hardware watchdog covers hard hangs.)
