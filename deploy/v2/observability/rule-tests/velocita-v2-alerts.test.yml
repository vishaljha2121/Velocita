      - series: 'velocita_v2_receipts{job="velocita-v2",host="nuc1",node="1",state="held"}'
        values: '256x30'
      - series: 'velocita_v2_receipt_capacity{job="velocita-v2",host="nuc1",node="1"}'
        values: '256x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: VelocitaPinnedReceiptsHigh
