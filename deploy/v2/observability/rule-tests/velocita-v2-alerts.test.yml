    alert_rule_test:
      - eval_time: 5m
        alertname: VelocitaArchiveFilling
        exp_alerts: []
      - eval_time: 15m
        alertname: VelocitaArchiveFilling
        exp_alerts: []
      - eval_time: 17m
        alertname: VelocitaArchiveFilling
        exp_alerts:
          - exp_labels: {severity: warning, job: velocita-v2, host: nuc1, node: "1"}
            exp_annotations:
              summary: "nuc1 archive is 71% of the ordinary budget"
              description: "When the archive is full every ordinary command is refused, including a strategy exit; only the operator kill path still works. See 'Days until the archive is full' on the Raft dashboard and plan a new incarnation or a larger budget before then."
      - eval_time: 24m
        alertname: VelocitaArchiveNearlyFull
        exp_alerts: []
      - eval_time: 32m
        alertname: VelocitaArchiveNearlyFull
        exp_alerts:
          - exp_labels: {severity: critical, job: velocita-v2, host: nuc1, node: "1"}
            exp_annotations:
              summary: "nuc1 archive is 92% of the ordinary budget: act now"
              description: "Ordinary commands stop at 100%. Flatten the position and stop the strategy while commands are still accepted, then start a new incarnation."
      - eval_time: 37m
        alertname: VelocitaArchiveFilling
        exp_alerts:
          - exp_labels: {severity: warning, job: velocita-v2, host: nuc1, node: "1"}
            exp_annotations:
              summary: "nuc1 archive is 92% of the ordinary budget"
              description: "When the archive is full every ordinary command is refused, including a strategy exit; only the operator kill path still works. See 'Days until the archive is full' on the Raft dashboard and plan a new incarnation or a larger budget before then."
          - exp_labels: {severity: warning, job: velocita-v2, host: pi, node: "2"}
            exp_annotations:
              summary: "pi archive is 75% of the ordinary budget"
              description: "When the archive is full every ordinary command is refused, including a strategy exit; only the operator kill path still works. See 'Days until the archive is full' on the Raft dashboard and plan a new incarnation or a larger budget before then."

  - interval: 1m
    input_series:
      - series: 'velocita_v2_policies{job="velocita-v2",host="nuc1",node="1"}'
        values: '5x5 6x10'
      - series: 'velocita_v2_policy_capacity{job="velocita-v2",host="nuc1",node="1"}'
        values: '8x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: VelocitaPolicySlotsLow
        exp_alerts: []
      - eval_time: 10m
        alertname: VelocitaPolicySlotsLow
        exp_alerts: []
      - eval_time: 12m
        alertname: VelocitaPolicySlotsLow
        exp_alerts:
          - exp_labels: {severity: warning, job: velocita-v2, host: nuc1, node: "1"}
            exp_annotations:
              summary: "nuc1 has used 75% of its policy slots"
              description: "Each published policy version keeps a slot for the life of the incarnation. When none are left a new strategy version is refused (policy_capacity_exceeded); plan a new incarnation before the next strategy change."

  - interval: 1m
    input_series:
      - series: 'velocita_v2_account_max_window_loss_micros{job="velocita-v2",host="nuc1",node="1",account="2",instrument="2"}'
        values: '10000000x20'
      - series: 'velocita_v2_account_max_window_loss_micros{job="velocita-v2",host="pi",node="2",account="2",instrument="2"}'
        values: '10000000x20'
      - series: 'velocita_v2_account_window_realized_pnl_micros{job="velocita-v2",host="nuc1",node="1",account="2",instrument="2"}'
        values: '-7900000 -7900000 -8000000x3 -10000000x14'
      - series: 'velocita_v2_account_window_realized_pnl_micros{job="velocita-v2",host="pi",node="2",account="2",instrument="2"}'
        values: '-7900000 -7900000 -8000000x3 -10000000x14'
      - series: 'velocita_v2_account_fees_paid_micros{job="velocita-v2",host="nuc1",node="1",account="2",instrument="2"}'
        values: '240000x20'
      - series: 'velocita_indicator_variant_fees_usd{job="indicator-paper",strategy="stochastic"}'
        values: '0.24x7 0.288x12'
    alert_rule_test:
      - eval_time: 1m
        alertname: VelocitaLossLimitNear
        exp_alerts: []
      - eval_time: 2m30s
        alertname: VelocitaLossLimitNear
        exp_alerts: []
      - eval_time: 4m
        alertname: VelocitaLossLimitNear
        exp_alerts:
          - exp_labels: {severity: warning, account: "2", instrument: "2"}
            exp_annotations:
              summary: "Account 2 is at 80% or more of its loss limit"
              description: "Realized loss since the last reset, against the kernel's limit. At 100% the kernel refuses every order that adds risk; orders that close the position still pass."
      - eval_time: 4m
        alertname: VelocitaLossLimitReached
        exp_alerts: []
      - eval_time: 6m
        alertname: VelocitaLossLimitReached
        exp_alerts:
          - exp_labels: {severity: critical, account: "2", instrument: "2"}
            exp_annotations:
              summary: "Account 2 reached its loss limit: the kernel refuses new risk"
              description: "Only an operator risk-limits command with reset_loss_window=1 clears it. Review the losses before resetting."
      - eval_time: 7m
        alertname: VelocitaLedgerMismatch
        exp_alerts: []
      - eval_time: 12m
        alertname: VelocitaLedgerMismatch
        exp_alerts: []
      - eval_time: 14m
        alertname: VelocitaLedgerMismatch
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "The kernel's fees and the venue report's fees differ by 48000 micro-dollars"
              description: "The kernel books every fill's fee, and the observer reads the venue's. They should be equal for a session that began with its incarnation. A difference means a fill was booked by one and not the other; stop and reconcile before trading on."

  - interval: 1m
    input_series:
      - series: 'velocita_v2_unauthorized_commands_total{job="velocita-v2",host="nuc1",node="1"}'
        values: '0 0 0 2x40'
      - series: 'velocita_v2_unauthorized_commands_total{job="velocita-v2",host="pi",node="2"}'
        values: '0 0 0 2x40'
      - series: 'velocita_v2_unauthorized_commands_total{job="velocita-v2",host="nuc2",node="3"}'
        values: '0 0 0 2x40'
      - series: 'velocita_v2_quorum_step_downs_total{job="velocita-v2",host="nuc2",node="3"}'
        values: '0 0 0 0 0 1x40'
      - series: 'velocita_v2_quorum_step_downs_total{job="velocita-v2",host="nuc1",node="1"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 2m
        alertname: VelocitaUnauthorizedCommand
        exp_alerts: []
      - eval_time: 4m
        alertname: VelocitaUnauthorizedCommand
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "A key sent 2 command(s) its role does not allow"
              description: "The command was signed by a known key, committed and refused by the kernel (ADR 0020). Either a role was not assigned in the ceremony (assign-role 21 strategy, 22 gateway), or a key is being used for something it should not do. The refusal leaves no receipt: find the command in the Raft log."
      - eval_time: 20m
        alertname: VelocitaUnauthorizedCommand
        exp_alerts: []
      - eval_time: 4m
        alertname: VelocitaLeaderSteppedDown
        exp_alerts: []
      - eval_time: 6m
        alertname: VelocitaLeaderSteppedDown
        exp_alerts:
          - exp_labels: {severity: warning, job: velocita-v2, host: nuc2, node: "3"}
            exp_annotations:
              summary: "nuc2 gave up leadership: it stopped hearing a majority"
              description: "The leader could send but heard no replies from a majority for two election timeouts, so it stepped down to let another voter lead. Check the network path into nuc2."
      - eval_time: 20m
        alertname: VelocitaLeaderSteppedDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'velocita_v2_strategy_mode{job="velocita-v2",host="nuc1",node="1"}'
        values: '1x4 6x44 5x30'
      - series: 'velocita_v2_strategy_mode{job="velocita-v2",host="pi",node="2"}'
        values: '1x4 6x44 5x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: VelocitaReducingModeLeftOn
        exp_alerts: []
      - eval_time: 36m
        alertname: VelocitaReducingModeLeftOn
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The strategy mode has been flatten for 30 minutes"
              description: "In these modes only orders that reduce the position are sent, and flatten sells whatever is held. Decide what comes next: strategy-mode halted to stay out, or strategy-mode normal and a gateway restart to trade again (ADR 0024)."
      - eval_time: 55m
        alertname: VelocitaReducingModeLeftOn
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'velocita_v2_strategy_mode{job="velocita-v2",host="nuc1",node="1"}'
        values: '4x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: VelocitaReducingModeLeftOn
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The strategy mode has been reduce_only for 30 minutes"
              description: "In these modes only orders that reduce the position are sent, and flatten sells whatever is held. Decide what comes next: strategy-mode halted to stay out, or strategy-mode normal and a gateway restart to trade again (ADR 0024)."

  - interval: 1m
    input_series:
      - series: 'velocita_v2_ingress_rate_limited_total{job="velocita-v2",host="nuc1",node="1"}'
        values: '0 0 0 40x40'
      - series: 'velocita_v2_ingress_rate_limited_total{job="velocita-v2",host="pi",node="2"}'
        values: '0x43'
    alert_rule_test:
      - eval_time: 2m
        alertname: VelocitaIngressRateLimited
        exp_alerts: []
      - eval_time: 5m
        alertname: VelocitaIngressRateLimited
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "A caller sent commands faster than its ingress rate allows"
              description: "A voter answered busy to 40 command(s) in 10 minutes because one caller exceeded ingress.rate_per_second. The strategy and the gateway stay far below it in normal use. Look for a client stuck in a retry loop, or a key being used by something else. Operator callers are never limited."
      - eval_time: 20m
        alertname: VelocitaIngressRateLimited
        exp_alerts: []
