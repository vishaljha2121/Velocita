        exp_alerts:
          - exp_labels: {severity: warning, host: nuc1, node: "1"}
            exp_annotations:
              summary: "nuc1: 78.12% of the receipt table cannot be reclaimed"
              description: "Receipts stay pinned while an effect is unsettled or the gateway has not acknowledged its results. At 100 % the kernel refuses new commands (receipt_capacity_exceeded). Check that the gateway is running and acknowledging."


  - interval: 10s
    input_series:
      - series: 'up{job="velocita-v2",instance="old:9410",host="old"}'
        values: '0x60'
      - series: 'velocita_v2_up{job="velocita-v2",instance="old:9410",host="old",node="1"}'
        values: '0x60'
      - series: 'up{job="velocita-v2",strategy="stochastic",instance="new:11410",host="pi"}'
        values: '1x29 0x31'
      - series: 'velocita_v2_up{job="velocita-v2",strategy="stochastic",instance="new:11410",host="pi",node="2"}'
        values: '1x29 _x31'
    alert_rule_test:
      - eval_time: 4m
        alertname: VelocitaVoterDown
        exp_alerts: []
      - eval_time: 8m
        alertname: VelocitaVoterDown
        exp_alerts:
          - exp_labels: {severity: critical, job: velocita-v2, strategy: stochastic, instance: 'new:11410', host: pi}
            exp_annotations:
              summary: "Voter on pi is not reporting"
              description: "Its health page is unreadable or its exporter is unreachable. Two of three voters still commit; one more loss stops the cluster."

  - interval: 1m
    input_series:
      - series: 'velocita_gateway_heartbeat_timestamp_seconds{job="active-paper-pipeline",host="nuc1",strategy="stochastic"}'
        values: '0+60x10 600x20'
      - series: 'velocita_gateway_up{job="active-paper-pipeline",host="nuc1",strategy="stochastic"}'
        values: '1x30'
    alert_rule_test:
