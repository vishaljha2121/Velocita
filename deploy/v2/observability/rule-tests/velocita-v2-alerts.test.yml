              description: "The observer cannot open the edge's ledger read-only, or it belongs to another run. The edge is probably stopped. On nuc1: systemctl --user status velocita-paper-stochastic-edge."

  - interval: 1m
    input_series:
      - series: 'velocita_v2_archive_bytes{job="velocita-v2",host="nuc1",node="1"}'
