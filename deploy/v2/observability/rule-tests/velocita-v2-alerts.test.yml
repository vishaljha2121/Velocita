      - series: 'velocita_v2_archive_bytes{job="velocita-v2",host="pi",node="2"}'
        values: '1000000x45'
      - series: 'velocita_v2_archive_byte_limit{job="velocita-v2",host="pi",node="2"}'
        values: '1073741824x45'
      - series: 'velocita_v2_archive_segments{job="velocita-v2",host="pi",node="2"}'
