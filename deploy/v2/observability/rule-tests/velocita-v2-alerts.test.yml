        exp_alerts: []
      - eval_time: 8m
        alertname: VelocitaPaperBadMarketData
        exp_alerts:
          - exp_labels: {severity: warning, job: active-paper-pipeline, host: nuc1, strategy: stochastic, outcome: bar_missing}
            exp_annotations:
              summary: "The edge received bar_missing market data in the last 10 minutes"
              description: "invalid: the price response did not decode or had a gap. bar_missing: the bar that just closed was not in the response. Invalid input blocks entry; a gap requires a fresh warmup."
      - eval_time: 25m
        alertname: VelocitaPaperBadMarketData
        exp_alerts: []
      - eval_time: 5m
        alertname: VelocitaPaperBuyStop
        exp_alerts: []
      - eval_time: 8m
        alertname: VelocitaPaperBuyStop
        exp_alerts:
          - exp_labels: {severity: warning, job: indicator-paper, host: nuc1, strategy: stochastic, reason: drawdown}
            exp_annotations:
              summary: "stochastic has stopped buying: drawdown"
              description: "drawdown, capacity and duration are permanent for this run and force an exit. unreconciled and insufficient_balance clear by themselves."
      - eval_time: 4m
        alertname: VelocitaPaperOrderCapacity
        exp_alerts: []
      - eval_time: 8m
        alertname: VelocitaPaperOrderCapacity
        exp_alerts:
          - exp_labels: {severity: warning, job: indicator-paper, host: nuc1, strategy: stochastic}
            exp_annotations:
              summary: "stochastic has used 80.42% of its lifetime orders"
              description: "The paper venue keeps every order for the life of the run. At 100 % the strategy stops buying and exits."


  - interval: 1m
    input_series:
      - series: 'velocita_indicator_run_state{strategy="stochastic",paper_run="completed"}'
        values: '1x5'
      - series: 'velocita_indicator_price_age_seconds{strategy="stochastic",paper_run="completed"}'
        values: '600x5'
      - series: 'velocita_indicator_buy_stop{strategy="stochastic",paper_run="completed",reason="duration"}'
