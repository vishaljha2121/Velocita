global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    cluster: velocita-v2-shadow

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: indicator-paper
    scrape_interval: 5s
    sample_limit: 1000
    metric_relabel_configs:
      - source_labels: [strategy]
        regex: stochastic
        action: keep
    static_configs:
      - targets: ["127.0.0.1:9460"]
        labels: {host: nuc1}  # run-scoped

  - job_name: active-paper-pipeline
    scrape_interval: 5s
    sample_limit: 1000
    metric_relabel_configs:
      - source_labels: [strategy]
        regex: stochastic
        action: keep
      - source_labels: [__name__]
        regex: 'velocita_indicator_(shadow|gateway)_.*'
        action: keep
      - source_labels: [__name__]
        regex: 'velocita_indicator_(.*)'
        target_label: __name__
        replacement: 'velocita_${1}'
    static_configs:
      - targets: ["127.0.0.1:9460"]
        labels: {host: nuc1}  # run-scoped

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels: {host: nuc1}

  - job_name: velocita-v2
    scrape_interval: 5s
    sample_limit: 500
    static_configs:
      - targets: ["100.72.127.102:11410"]
        labels: {host: nuc1, strategy: stochastic}  # run-scoped
      - targets: ["100.84.151.116:11410"]
        labels: {host: pi, strategy: stochastic}  # run-scoped
      - targets: ["100.85.36.22:11410"]
        labels: {host: nuc2, strategy: stochastic}  # run-scoped

  - job_name: node
    scrape_interval: 10s
    sample_limit: 20000
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'velocita_(gateway|shadow|paper)_.*'
        action: drop
    static_configs:
      - targets: ["100.72.127.102:9110"]
        labels: {host: nuc1}
      - targets: ["100.84.151.116:9110"]
        labels: {host: pi}
      - targets: ["100.85.36.22:9110"]
        labels: {host: nuc2}
