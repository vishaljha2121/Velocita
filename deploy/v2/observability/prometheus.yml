# Prometheus for the V2 three-host shadow cluster (M3a). Runs on nuc1,
# listening on 127.0.0.1 only; Grafana reads it, and it sends alerts to Alertmanager.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    cluster: velocita-v2-shadow

rule_files:
  - /etc/prometheus/rules/*.yml

# Firing alerts go to Alertmanager on this host, which pushes them to the phone
# through the self-hosted ntfy server (docs/ALERT_DELIVERY_RUNBOOK.md).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels: {host: nuc1}

  # One exporter per voter, reading that voter's seqlock health page.
  - job_name: velocita-v2
    scrape_interval: 5s
    sample_limit: 500
    static_configs:
      - targets: ["100.72.127.102:9410"]
        labels: {host: nuc1}
      - targets: ["100.84.151.116:9410"]
        labels: {host: pi}
      - targets: ["100.85.36.22:9410"]
        labels: {host: nuc2}

  # Host metrics (CPU, memory, disk latency, temperature, network) plus the
  # soak bot's textfile metrics on nuc1.
  - job_name: node
    scrape_interval: 10s
    sample_limit: 20000
    static_configs:
      - targets: ["100.72.127.102:9110"]
        labels: {host: nuc1}
      - targets: ["100.84.151.116:9110"]
        labels: {host: pi}
      - targets: ["100.85.36.22:9110"]
        labels: {host: nuc2}
