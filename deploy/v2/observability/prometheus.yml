# Prometheus for the V2 three-host shadow cluster (M3a). Runs on nuc1,
# listening on 127.0.0.1 only; Grafana reads it, and it sends alerts to Alertmanager.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    cluster: velocita-v2-shadow

rule_files:
  - /etc/prometheus/rules/*.yml

# Firing alerts go to Alertmanager on this host, which pushes them to the phone
# through the self-hosted ntfy server (docs/ALERT_DELIVERY_RUNBOOK.md).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: indicator-paper
    scrape_interval: 5s
    sample_limit: 1000
    metric_relabel_configs:
      - source_labels: [strategy]
        regex: stochastic
        action: keep
    static_configs:
      - targets: ["127.0.0.1:9460"]
        labels: {host: nuc1}

  - job_name: active-paper-pipeline
    scrape_interval: 5s
    sample_limit: 1000
    metric_relabel_configs:
      - source_labels: [strategy]
        regex: stochastic
        action: keep
      - source_labels: [__name__]
        regex: 'velocita_indicator_(shadow|gateway)_.*'
        action: keep
      - source_labels: [__name__]
        regex: 'velocita_indicator_(.*)'
        target_label: __name__
        replacement: 'velocita_${1}'
    static_configs:
      - targets: ["127.0.0.1:9460"]
        labels: {host: nuc1}

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels: {host: nuc1}

  # One exporter per voter, reading that voter's seqlock health page.
  - job_name: velocita-v2
    scrape_interval: 5s
    sample_limit: 500
    static_configs:
      - targets: ["100.72.127.102:11410"]
        labels: {host: nuc1, strategy: stochastic}
      - targets: ["100.84.151.116:11410"]
        labels: {host: pi, strategy: stochastic}
      - targets: ["100.85.36.22:11410"]
        labels: {host: nuc2, strategy: stochastic}

  # Host metrics (CPU, memory, disk latency, temperature, network) plus each
  # host's textfile metrics: the secrets check everywhere, and on nuc1 the edge,
  # the gateway, md-stream and md-archive.
  - job_name: node
    scrape_interval: 10s
    sample_limit: 20000
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'velocita_(gateway|shadow|paper)_.*'
        action: drop
    static_configs:
      - targets: ["100.72.127.102:9110"]
        labels: {host: nuc1}
      - targets: ["100.84.151.116:9110"]
        labels: {host: pi}
      - targets: ["100.85.36.22:9110"]
        labels: {host: nuc2}
