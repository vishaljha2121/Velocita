global:
  resolve_timeout: 5m

route:
  receiver: phone
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: phone
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: ['alertname="VelocitaVoterDown"']
    target_matchers: ['severity="warning"']
    equal: [host]
  - source_matchers: ['alertname="VelocitaQuorumLost"']
    target_matchers: ['alertname!="VelocitaQuorumLost"', 'severity="warning"']

receivers:
  - name: phone
    webhook_configs:
      - url: "http://100.72.127.102:2586/velocita-alerts?template=velocita"
        send_resolved: true
        max_alerts: 10
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/ntfy-token
