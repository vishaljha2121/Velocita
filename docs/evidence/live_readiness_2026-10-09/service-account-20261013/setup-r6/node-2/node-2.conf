# Three-host shadow: voter 2 on the Pi; voter 1 on nuc1, voter 3 on nuc2.
# Non-trading. Paths are as seen INSIDE the container (velocita-v2-node@.service).
# Commits need two durable copies of three, so any one voter may be lost.
#
# Fill placeholders with sed (never hand-copy secrets):
#   b79e65be1ea14e219016ec48ea02efef  32 hex digits, a NEW value, identical in all three voter configs
#   3b8b7f798e31c6ce39ef6a88ba44fd2644ec8c6e4792ed7beb227fd14a532dfe printed by velocita-v2-shadow-catalog
#
# The node compacts its log once it retains 2,048 entries (the default of
# history.compact_at_entries), but never above the index every voter holds
# durably, so a voter that keeps up always catches up from retained entries. A
# voter that falls behind a compacted prefix stays a quiet follower and needs a
# manual repair: the online snapshot installer does not exist yet (M6).
node_id = 2
data_root = /var/lib/velocita-v2/node-2
# First start only; switch to "recover" after the first successful start.
startup = bootstrap
cluster.incarnation = b79e65be1ea14e219016ec48ea02efef
catalog.root = 3b8b7f798e31c6ce39ef6a88ba44fd2644ec8c6e4792ed7beb227fd14a532dfe
catalog.file = /etc/velocita/catalog.bin
deployment_mode = laboratory

# Voter links over Tailscale (WireGuard-encrypted), one secret per pair.
voter.1.endpoint = 100.72.127.102:44201
voter.1.key_file = /run/velocita-secrets/link-1-2.key
voter.2.endpoint = 100.84.151.116:44202
voter.3.endpoint = 100.85.36.22:44203
voter.3.key_file = /run/velocita-secrets/link-2-3.key

# The Mac reaches this voter over Tailscale.
ingress.endpoint = 100.84.151.116:44302

# Operator caller 9 = CallerId 7; responses to the Mac's Tailscale address.
caller.9.caller_id = 7
caller.9.key_file = /run/velocita-secrets/caller-9.key
caller.9.response_endpoint = 100.91.80.64:44400

# Soak bot (caller key 10 = CallerId 8): results go to nuc1, not the Mac.
caller.10.caller_id = 8
caller.10.key_file = /run/velocita-secrets/caller-10.key
caller.10.response_endpoint = 100.72.127.102:44410

# Shadow setup (caller key 11 = CallerId 9, operator band) on nuc1: the
# operator's one-shot program install and strategy-mode change. Its own key,
# replay fence and response port, so it never collides with the operator or soak bot.
caller.11.caller_id = 9
caller.11.key_file = /run/velocita-secrets/caller-11.key
caller.11.response_endpoint = 100.72.127.102:44411

# Strategy tick loop (caller key 12 = CallerId 21) on nuc1: proposes and, in
# paper mode, asks for authorization. Outside the operator band: it can never
# change controls.
caller.12.caller_id = 21
caller.12.key_file = /run/velocita-secrets/caller-12.key
caller.12.response_endpoint = 100.72.127.102:44412

# Paper gateway (caller key 13 = CallerId 22) on nuc1: claims authorized effects
# and reports simulated fills. Outside the operator band.
caller.13.caller_id = 22
caller.13.key_file = /run/velocita-secrets/caller-13.key
caller.13.response_endpoint = 100.72.127.102:44413
gateway.caller = 22

history.max_wal_bytes = 1073741824
ingress.rate_per_second = 6
ingress.burst = 60

caller.14.caller_id = 23
caller.14.key_file = /run/velocita-secrets/caller-14.key
caller.14.response_endpoint = 100.72.127.102:44414
signer.caller = 23
